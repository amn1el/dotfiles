# =====================
# Appearance
# =====================
[appearance]
prefer_no_csd = true
border_width = 1
corner_radius = 10

[appearance.blur]
enabled = true
optimized = true
passes = 3
radius = 3
noise = 0.02
brightness = 0.9
contrast = 0.9
saturation = 1.1

# =====================
# Layout
# =====================
[layout]
mode = "master"
extent_presets = [0.333, 0.5, 0.667]

[layout.scrolling]
default_extent_fraction = 0.5
